<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <div class="page">

    <aside class="side">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="tagline">{{ site.tagline }}</p>

      <nav aria-label="Sections">
        <ul>
          {% for item in site.nav %}
            {% assign target = item.url | relative_url %}
            {% if page.url == item.url %}
              <li><a href="{{ target }}" class="here" aria-current="page">{{ item.title }}</a></li>
            {% else %}
              <li><a href="{{ target }}">{{ item.title }}</a></li>
            {% endif %}
          {% endfor %}
        </ul>
      </nav>
    </aside>

    <main class="body">
      {{ content }}
    </main>

  </div>

</body>
</html>
